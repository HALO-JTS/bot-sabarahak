name: Run Bot Samapta (Pagi 08.00 & Malam 20.00 WIB)

on:
  schedule:
    # Pukul 08.00 WIB pagi (01:00 UTC) -> Patroli Siang & DIMTAQ
    - cron: '0 1 * * *'
    # Pukul 20.00 WIB malam (13:00 UTC) -> Patroli Malam
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pilih mode (siang / malam / dimtaq)'
        required: false
        default: 'siang'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Library
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: Tentukan Mode Berdasarkan Jam WIB
        id: pilih_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'siang' }}" >> $GITHUB_OUTPUT
          else
            JAM_WIB=$(date +%H)
            if [ "$JAM_WIB" -ge 15 ]; then
              echo "mode=malam" >> $GITHUB_OUTPUT
            else
              echo "mode=siang" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Jalankan Bot Samapta
        # Sesuaikan nama file .py di bawah ini jika nama file Anda berbeda (misal: bot.py atau bot_samapta.py)
        run: python bot.py ${{ steps.pilih_mode.outputs.mode }}
        env:
          POSKO_EMAIL: ${{ secrets.POSKO_EMAIL }}
          POSKO_PASSWORD: ${{ secrets.POSKO_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
